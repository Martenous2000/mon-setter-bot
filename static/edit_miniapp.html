<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modifier la reponse</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--tg-theme-bg-color, #fff);
    color: var(--tg-theme-text-color, #000);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { display: flex; flex-direction: column; height: 100vh; padding: 12px; box-sizing: border-box; }
  .label { font-size: 13px; opacity: 0.6; margin-bottom: 6px; }
  textarea {
    flex: 1; width: 100%; box-sizing: border-box; resize: none;
    font-size: 16px; line-height: 1.4; padding: 10px;
    border: 1px solid var(--tg-theme-hint-color, #ccc); border-radius: 8px;
    background: var(--tg-theme-secondary-bg-color, #f5f5f5);
    color: var(--tg-theme-text-color, #000);
  }
  .toolbar { display: flex; gap: 8px; margin-bottom: 8px; }
  .pitch-btn {
    font-size: 14px; padding: 8px 14px; border-radius: 8px; border: none;
    background: var(--tg-theme-button-color, #2481cc);
    color: var(--tg-theme-button-text-color, #fff);
  }
  .schedule-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .schedule-row input {
    width: 64px; font-size: 16px; padding: 8px; text-align: center;
    border: 1px solid var(--tg-theme-hint-color, #ccc); border-radius: 8px;
    background: var(--tg-theme-secondary-bg-color, #f5f5f5);
    color: var(--tg-theme-text-color, #000);
  }
  .schedule-row span { font-size: 14px; opacity: 0.7; }
</style>
</head>
<body>
<div class="wrap">
  <div class="label" id="mainLabel">Modifie le texte puis appuie sur Envoyer en bas.</div>
  <div class="schedule-row" id="scheduleRow" style="display:none;">
    <input type="number" id="mins" min="0" max="59" value="0" inputmode="numeric"><span>min</span>
    <input type="number" id="secs" min="0" max="59" value="30" inputmode="numeric"><span>sec avant envoi</span>
  </div>
  <div class="toolbar" id="toolbar"></div>
  <textarea id="txt"></textarea>
</div>
<script>
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  const params = new URLSearchParams(window.location.search);
  const initialText = decodeURIComponent(params.get('text') || '');
  const accountKey = params.get('account') || '';
  const chatId = params.get('chat') || '';
  const mode = params.get('mode') || 'edit';

  const textarea = document.getElementById('txt');
  textarea.value = initialText;

  if (mode === 'schedule') {
    document.getElementById('mainLabel').textContent = 'Modifie le texte si besoin, choisis le delai, puis appuie sur Programmer en bas.';
    document.getElementById('scheduleRow').style.display = 'flex';
  }

  const PITCHES = {
    henry: "Concretement, je propose un accompagnement pour les chefs de projet IT qui veulent gagner en methode et en posture sur le terrain : une seance de coaching individuelle d'1h a 1h30 ou on part de vos problematiques concretes, avec ensuite un plan d'action clair, ou un accompagnement sur 3 mois si vous voulez travailler ca dans la duree (cadrage, pilotage, gouvernance, arbitrages). Je propose un premier echange gratuit de 20-30 minutes, un Audit Flash Projet IT, pour voir concretement ou vous en etes et si ca peut vous aider.\n\nVous seriez dispo cette semaine pour un rapide echange ?",
    enzo: "So concretely, I help US and Canadian companies get into the French market fast, without the cost and delay of hiring a full time France or Europe sales lead. I can start with a market study to validate the opportunity, then run a 90 day sprint to set up the sales strategy and land your first French accounts, or act directly as your France sales rep on an ongoing basis.\n\nWould you be free for a quick call this week?",
    christiane: "Concretement, je construis des agents IA sur mesure qui couvrent tout le spectre operationnel d'une entreprise BTP : facturation automatisee, suivi de chantier, relances clients, reporting temps reel, gestion des reseaux sociaux, communication interne. Tout est connecte entre eux, ce n'est pas des outils isoles poses cote a cote mais un vrai systeme integre construit autour de votre realite terrain. Le setup demarre a 6 000 euros.\n\nJe vous propose un call pour cadrer precisement votre besoin, vous seriez disponible cette semaine ?",
    keanu: "Concretement, j'installe une infrastructure commerciale autonome qui inonde ton agenda de rendez-vous ultra qualifies grace a l'IA, pour un pipeline previsible qui ne depend plus de la prospection manuelle. En moyenne +21,8K euros/mois generes sous 68 jours pour les dirigeants B2B que j'accompagne.\n\nCa te dit qu'on regarde ensemble comment ca pourrait s'appliquer a ton activite cette semaine ?",
    nathan: "Concretement, je construis des sites vitrines professionnels en pleine propriete : le site est vraiment a toi des la livraison, pas d'abonnement mensuel captif comme la plupart des agences. C'est pense pour des boites BTP/energie/sante qui tournent bien mais dont le site ne reflete pas le serieux de l'activite reelle.\n\nOn peut en discuter sur un rapide call cette semaine si tu veux ?",
    viannard: "Concretement, j'accompagne les entreprises sur l'expertise comptable et l'audit, avec une double competence France et Luxembourg, utile si vous avez une activite transfrontaliere ou une implantation luxembourgeoise. Je prefere qu'on parte de votre situation concrete plutot que d'un discours generique sur l'optimisation.\n\nVous seriez disponible pour un echange cette semaine ?",
    martin: "Concretement, j'installe une infrastructure commerciale autonome qui inonde ton agenda de rendez-vous ultra qualifies grace a l'IA, pour un pipeline previsible qui ne depend plus de la prospection manuelle. En moyenne +21,8K euros/mois generes sous 68 jours pour les dirigeants B2B que j'accompagne.\n\nCa te dit qu'on regarde ensemble comment ca pourrait s'appliquer a ton activite cette semaine ?",
    'jean-pierre': "Concretement, j'installe une infrastructure commerciale autonome qui inonde ton agenda de rendez-vous ultra qualifies grace a l'IA, pour un pipeline previsible qui ne depend plus de la prospection manuelle. En moyenne +21,8K euros/mois generes sous 68 jours pour les dirigeants B2B que j'accompagne.\n\nCa te dit qu'on regarde ensemble comment ca pourrait s'appliquer a ton activite cette semaine ?",
    jules: "Concretement, j'installe une infrastructure commerciale autonome qui inonde ton agenda de rendez-vous ultra qualifies grace a l'IA, pour un pipeline previsible qui ne depend plus de la prospection manuelle. En moyenne +21,8K euros/mois generes sous 68 jours pour les dirigeants B2B que j'accompagne.\n\nCa te dit qu'on regarde ensemble comment ca pourrait s'appliquer a ton activite cette semaine ?",
    thomas: "Concretement, j'installe une infrastructure commerciale autonome qui inonde ton agenda de rendez-vous ultra qualifies grace a l'IA, pour un pipeline previsible qui ne depend plus de la prospection manuelle. En moyenne +21,8K euros/mois generes sous 68 jours pour les dirigeants B2B que j'accompagne.\n\nCa te dit qu'on regarde ensemble comment ca pourrait s'appliquer a ton activite cette semaine ?",
    theo: "Concretement, j'installe une infrastructure commerciale autonome qui inonde ton agenda de rendez-vous ultra qualifies grace a l'IA, pour un pipeline previsible qui ne depend plus de la prospection manuelle. En moyenne +21,8K euros/mois generes sous 68 jours pour les dirigeants B2B que j'accompagne.\n\nCa te dit qu'on regarde ensemble comment ca pourrait s'appliquer a ton activite cette semaine ?",
  };

  const pitchText = PITCHES[accountKey];
  if (pitchText) {
    const toolbar = document.getElementById('toolbar');
    const btn = document.createElement('button');
    btn.className = 'pitch-btn';
    btn.type = 'button';
    btn.textContent = 'Pitch';
    btn.onclick = () => {
      const sep = textarea.value.trim() ? '\n\n' : '';
      textarea.value = textarea.value + sep + pitchText;
      textarea.focus();
    };
    toolbar.appendChild(btn);
  }

  tg.MainButton.setText(mode === 'schedule' ? 'Programmer' : 'Envoyer');
  tg.MainButton.show();
  tg.MainButton.onClick(async () => {
    tg.MainButton.showProgress();
    try {
      let resp;
      if (mode === 'schedule') {
        const mins = parseInt(document.getElementById('mins').value, 10) || 0;
        const secs = parseInt(document.getElementById('secs').value, 10) || 0;
        const delaySeconds = mins * 60 + secs;
        if (delaySeconds <= 0) {
          tg.MainButton.hideProgress();
          alert('Choisis un delai superieur a 0 seconde.');
          return;
        }
        resp = await fetch('/telegram/schedule-submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ accountKey, chatId, finalText: textarea.value, delaySeconds }),
        });
      } else {
        resp = await fetch('/telegram/edit-submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ accountKey, chatId, finalText: textarea.value }),
        });
      }
      const data = await resp.json();
      if (data.ok) {
        tg.close();
      } else {
        tg.MainButton.hideProgress();
        alert('Erreur : ' + (data.error || 'inconnue'));
      }
    } catch (e) {
      tg.MainButton.hideProgress();
      alert('Erreur reseau : ' + e.message);
    }
  });
</script>
</body>
</html>
