<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bot HITL</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--tg-theme-bg-color, #17212b);
    color: var(--tg-theme-text-color, #f5f5f5);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { display: flex; flex-direction: column; height: 100vh; padding: 12px; box-sizing: border-box; }
  .title { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
  .instr { font-size: 13px; opacity: 0.6; margin-bottom: 10px; }
  .toolbar { display: flex; gap: 8px; margin-bottom: 10px; }
  .pitch-btn {
    font-size: 14px; padding: 8px 14px; border-radius: 8px; border: none;
    background: var(--tg-theme-secondary-bg-color, #232e3c);
    color: var(--tg-theme-link-color, #6ab3f3);
  }
  textarea {
    flex: 1; width: 100%; box-sizing: border-box; resize: none;
    font-size: 16px; line-height: 1.4; padding: 10px;
    border: 1px solid var(--tg-theme-hint-color, #708499); border-radius: 8px;
    background: var(--tg-theme-secondary-bg-color, #232e3c);
    color: var(--tg-theme-text-color, #f5f5f5);
    margin-bottom: 10px;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="title" id="title">Bot</div>
  <div class="instr">Modifie le texte puis appuie sur Envoyer en bas.</div>
  <div class="toolbar">
    <button class="pitch-btn" type="button" id="pitchBtn">&#10133; Pitch</button>
  </div>
  <textarea id="txt"></textarea>
</div>
<script>
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  const tp = tg.themeParams || {};
  if (tp.bg_color) document.body.style.background = '#' + tp.bg_color;
  if (tp.text_color) document.body.style.color = '#' + tp.text_color;

  const params = new URLSearchParams(window.location.search);
  const initialText = decodeURIComponent(params.get('text') || '');
  const compte = params.get('compte') || '';
  const chatId = params.get('chat_id') || '';

  document.getElementById('title').textContent = 'Bot ' + compte;

  const textarea = document.getElementById('txt');
  textarea.value = initialText;

    keanu: "Concretement on t'aide a obtenir des rendez-vous ultra qualifies en automatique chaque mois, sans que tu aies a toucher a la prospection. On installe un systeme IA sur mesure qui gere tout en done for you, et on garantit les resultats contractuellement. Le but c'est simple : que tu te retrouves face a des prospects qui ont le budget, le besoin et la decision, prets a signer.",
    samuel: "Concretement on t'aide a obtenir des rendez-vous ultra qualifies en automatique chaque mois, sans que tu aies a toucher a la prospection. On installe un systeme IA sur mesure qui gere tout en done for you, et on garantit les resultats contractuellement. Le but c'est simple : que tu te retrouves face a des prospects qui ont le budget, le besoin et la decision, prets a signer.",
    samuellyon: "Concretement on t'aide a obtenir des rendez-vous ultra qualifies en automatique chaque mois, sans que tu aies a toucher a la prospection. On installe un systeme IA sur mesure qui gere tout en done for you, et on garantit les resultats contractuellement. Le but c'est simple : que tu te retrouves face a des prospects qui ont le budget, le besoin et la decision, prets a signer.",
    cyril: "Concretement on t'aide a obtenir des rendez-vous ultra qualifies en automatique chaque mois, sans que tu aies a toucher a la prospection. On installe un systeme IA sur mesure qui gere tout en done for you, et on garantit les resultats contractuellement. Le but c'est simple : que tu te retrouves face a des prospects qui ont le budget, le besoin et la decision, prets a signer.",
    franck: "Concretement on t'aide a obtenir des rendez-vous ultra qualifies en automatique chaque mois, sans que tu aies a toucher a la prospection. On installe un systeme IA sur mesure qui gere tout en done for you, et on garantit les resultats contractuellement. Le but c'est simple : que tu te retrouves face a des prospects qui ont le budget, le besoin et la decision, prets a signer.",
    christiane: "Concretement on t'aide a obtenir des rendez-vous ultra qualifies en automatique chaque mois, sans que tu aies a toucher a la prospection. On installe un systeme IA sur mesure qui gere tout en done for you, et on garantit les resultats contractuellement. Le but c'est simple : que tu te retrouves face a des prospects qui ont le budget, le besoin et la decision, prets a signer.",
    nathan: "Concretement on t'aide a attirer des clients premium en automatique grace a une landing page ultra optimisee qui convertit pour toi 24h/24, sans que tu aies a courir apres les prospects. On concoit une page qui parle directement a ta cible, met en valeur ton expertise et declenche des prises de contact qualifiees en automatique. Le but c'est simple : que les bons clients arrivent a toi, avec le budget et le projet, prets a demarrer.",
    elora: "Concretement on t'aide a attirer des clients premium en automatique grace a une landing page ultra optimisee qui convertit pour toi 24h/24, sans que tu aies a courir apres les prospects. On concoit une page qui parle directement a ta cible, met en valeur ton expertise et declenche des prises de contact qualifiees en automatique. Le but c'est simple : que les bons clients arrivent a toi, avec le budget et le projet, prets a demarrer.",
    henry: "Concretement j'accompagne des chefs de projet IT juniors et des profils en reconversion a prendre les bons reflexes sur le terrain : le cadrage, la gestion des parties prenantes, la posture face aux sponsors. Je propose un Audit Flash Projet IT, un echange offert de 20 a 30 minutes, pour qu'on regarde ensemble ce qui vous met le plus en difficulte aujourd'hui.",
    viannard: "Je vous accompagne sur l'expertise comptable et l'audit, avec une double competence France et Luxembourg, utile pour les structures ayant une activite transfrontaliere. Mon point d'entree c'est toujours votre situation comptable et fiscale concrete, jamais un discours generique sur l'optimisation.",
    enzo: "I help US and Canadian companies enter and start selling in the French market, as a first step into Europe. You already have the network in France, so instead of a 2-month onboarding and a senior local hire, companies can start selling in France almost immediately through me.",
    florian: "Concretement on t'aide a obtenir des rendez-vous ultra qualifies en automatique chaque mois, sans que tu aies a toucher a la prospection. On installe un systeme IA sur mesure qui gere tout en done for you, et on garantit les resultats contractuellement. Le but c'est simple : que tu te retrouves face a des prospects qui ont le budget, le besoin et la decision, prets a signer.",
  };

  const FALLBACK_PITCH = PITCHES.martin;

  function getPitch() {
    const key = (compte || '').trim().toLowerCase();
    return PITCHES[key] || FALLBACK_PITCH;
  }

  document.getElementById('pitchBtn').addEventListener('click', () => {
    const pitch = getPitch();
    const sep = textarea.value.trim() ? '\n\n' : '';
    textarea.value = textarea.value + sep + pitch;
    textarea.focus();
  });

  function doSend() {
    tg.sendData(JSON.stringify({ chat_id: chatId, text: textarea.value }));
  }

  if (tg.MainButton) {
    tg.MainButton.setText('Envoyer');
    tg.MainButton.show();
    tg.MainButton.onClick(doSend);
  }
</script>
</body>
</html>
